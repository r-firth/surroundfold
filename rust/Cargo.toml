[package]
name = "surroundfold"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Offline object- and channel-audio binaural renderer"
repository = "https://github.com/ryanfirth/surroundfold"
license = "Apache-2.0"
publish = false

[[bin]]
name = "surroundfold"
path = "src/main.rs"

[features]
default = ["embedded-truehd"]
embedded-truehd = ["dep:truehd"]

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
ctrlc = "3.5.2"
hound = "3.5.1"
log = "0.4.29"
nix = { version = "0.31.3", features = ["signal"] }
realfft = "3.5.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
truehd = { version = "=0.4.0", optional = true }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
